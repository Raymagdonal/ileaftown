services:
  - type: web
    name: ileaf-luxury-backend
    env: node
    plan: free
    region: oregon
    branch: main
    buildCommand: npm install --prefix server
    startCommand: node server/server.js
    autoDeploy: true
    repo: https://github.com/Raymagdonal/ileaftown
services:
  - type: web
    name: ileaf-luxury-backend
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
